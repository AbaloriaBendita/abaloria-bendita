<!-- ================= JS ================= -->
<script>
/* NAV MOBILE */
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".nav-toggle");
  const nav = document.querySelector(".main-nav");
  if (!toggle || !nav) return;

  toggle.addEventListener("click", () => {
    nav.classList.toggle("is-open");
  });
});
</script>

<script>
/* MODAL */
document.addEventListener("DOMContentLoaded", () => {

  const modal = document.getElementById("modal-encargo");
  const modalImg = document.getElementById("modal-img-preview");
  const modalInput = document.getElementById("modal-img-input");

  document.addEventListener("click", e => {
    const btn = e.target.closest(".js-open-modal");
    if (!btn) return;

    e.preventDefault();
    modalImg.src = btn.dataset.img;
    modalInput.value = btn.dataset.img;

    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
  });

  modal.addEventListener("click", e => {
    if (
      e.target.classList.contains("modal-backdrop") ||
      e.target.classList.contains("modal-close")
    ) {
      modal.classList.remove("is-open");
    }
  });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  console.log("✅ Script catálogo universal cargado");

  const GRID = document.getElementById("collection-grid");
  if (!GRID) {
    console.error("❌ No existe #collection-grid");
    return;
  }

  /* =========================
     1. DETECTAR COLECCIÓN ACTUAL
     Ej: /colecciones/55/ → "55"
  ========================= */

  const slug = window.location.pathname
    .split("/")
    .filter(Boolean)
    .pop();

  const BASE = `${window.location.origin}/assets/colecciones/${slug}/`;

  console.log("📁 Colección:", slug);
  console.log("📦 Assets base:", BASE);

  /* =========================
     2. PIEZAS (universal)
  ========================= */

  const PIEZAS = [
    `${slug}-01`,
    `${slug}-02`,
    `${slug}-03`,
    `${slug}-04`,
    `${slug}-05`,
  ];

  /* =========================
     3. HELPER: comprobar imagen real
  ========================= */

  const canLoad = (url) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url + `?v=${Date.now()}`;
    });

  /* =========================
     4. LOOP PIEZAS
  ========================= */

  for (const id of PIEZAS) {
    try {
      /* ---------- DATA ---------- */
      const res = await fetch(`${BASE}${id}/data.json`);
      if (!res.ok) continue;

      const data = await res.json();

      const estadoClass = data.estado === "disponible" ? "available" : "sold";
      const statusText  = data.estado === "disponible" ? "Disponible" : "Vendida";

      const card = document.createElement("article");
      card.className = `piece-card ${estadoClass}`;

      /* ---------- IMÁGENES ---------- */

      const mainCandidates = [
        `${BASE}${id}/main.jpg`,
        `${BASE}${id}/man.jpg`,
      ];

      const hoverCandidates = [
        `${BASE}${id}/hover.jpg`,
        `${BASE}${id}/hver.jpg`,
      ];

      let mainImg = null;
      for (const url of mainCandidates) {
        if (await canLoad(url)) {
          mainImg = url;
          break;
        }
      }
      if (!mainImg) continue;

      let hoverImg = null;
      for (const url of hoverCandidates) {
        if (await canLoad(url)) {
          hoverImg = url;
          break;
        }
      }

      const imageHTML = hoverImg
  ? `
    <div class="piece-image has-swipe">
      <span class="status-badge ${estadoClass}">${statusText}</span>
      <span class="price-badge">${data.precio}€</span>

      <img src="${mainImg}" alt="">
      <img src="${hoverImg}" alt="" class="hover-img" aria-hidden="true">
    </div>
  `
  : `
<div class="piece-image has-swipe">
      <span class="status-badge ${estadoClass}">${statusText}</span>
      <span class="price-badge">${data.precio}€</span>

      <img src="${mainImg}" alt="">
    </div>
  `;

      /* ---------- CTA ---------- */

      const cta =
        data.estado === "disponible"
          ? `
            <a href="${data.sumup_link}" class="piece-cta">
              Comprar ahora
            </a>
          `
          : `
            <a
              href="#"
              class="piece-cta alt js-open-modal"
              data-img="${mainImg}"
            >
              Encargar parecida
            </a>
          `;

      /* ---------- CARD FINAL ---------- */

      card.innerHTML = `
        ${imageHTML}

        <div class="piece-body">
          <h2>${data.titulo}</h2>

          ${cta}

          <ul class="piece-legal">
            <li>Envío gratis a partir de 150 €.</li>
            <li>IVA incluido.</li>
          </ul>
        </div>
      `;

      GRID.appendChild(card);

    } catch (err) {
      console.error("❌ Error cargando", id, err);
    }
  }
});
</script>
