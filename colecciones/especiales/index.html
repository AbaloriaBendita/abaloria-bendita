  <!-- TRACKING COLLECTION (AQUÍ) -->
 <script>
  window.dataLayer = window.dataLayer || [];

  const lang = window.location.pathname.startsWith("/en") ? "en" : "es";

  // 👉 CONFIG POR PÁGINA (solo cambias esto)
  const collection = 'especiales';
  const price = '120';

  // 1. VIEW COLLECTION
  window.dataLayer.push({
    event: 'view_collection',
    collection: collection,
    price_range: price,
    lang: lang
  });

  // 2. CLICK EN PRODUCTO
  document.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', () => {
      window.dataLayer.push({
        event: 'select_item',
        collection: collection,
        lang: lang
      });
    });
  });

  // 3. CTA (si hay botón en colección)
  document.querySelectorAll('.cta-pill, .cta-main').forEach(btn => {
    btn.addEventListener('click', () => {
      window.dataLayer.push({
        event: 'cta_click',
        location: 'collection',
        collection: collection,
        lang: lang
      });
    });
  });

</script>
