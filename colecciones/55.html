<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<a class="skip" href="#contenido">Saltar al contenido</a>

<!-- =========================
     HEADER
========================= -->
<header class="site-header">
  <div class="header-inner">

    <a href="/" class="logo-link" aria-label="Abaloria Bendita">
      <img
        src="/assets/icons/logo-abaloria-horizontal.svg"
        alt="Abaloria Bendita"
        class="logo-img"
        loading="eager"
        decoding="async"
      >
    </a>

    <nav class="main-nav">
      <a href="/index.html#colecciones">Colecciones</a>
      <a href="/index.html#como-atraparlo">Cómo atraparlo</a>
      <a href="/index.html#encargo" class="nav-cta desktop-only">
        Encargar<span class="cta-dot">.</span>
      </a>
    </nav>

    <div class="header-actions mobile-only">
      <a href="/index.html#encargo" class="nav-cta">
        Encargar<span class="cta-dot">.</span>
      </a>
      <button class="nav-toggle" aria-label="Abrir menú">☰</button>
    </div>

  </div>
</header>

<!-- =========================
     MAIN
========================= -->
<main id="contenido">

<section class="available-page">

  <!-- INTRO -->
  <div class="available-intro">
    <h1>
      Sencilla con grac<span class="c-red">i</span>a<span class="c-yellow">.</span>
    </h1>
    <p>
      Collares únicos hechos a mano.<br>
      Precio fijo: <strong>55 €</strong>
    </p>
  </div>

  <!-- GRID DINÁMICO -->
  <div class="available-grid" id="collection-grid"></div>

</section>

</main>

<!-- =========================
     FOOTER
========================= -->
<footer class="site-footer">
  <div class="container footer-inner">

    <div class="footer-brand">
      <img
        src="/assets/icons/logo-abaloria-horizontal.svg"
        alt="Abaloria Bendita"
        class="footer-logo"
      >
    </div>

    <div class="footer-links">
      <a href="https://instagram.com/TU_USUARIO" target="_blank" rel="noopener" class="footer-ig">
        <img src="/assets/IG_logo.png" alt="Instagram Abaloria Bendita">
        <span>Síguenos en Instagram</span>
      </a>

      <a href="mailto:hola@abaloriabendita.es" class="footer-mail">
        hola@abaloriabendita.es
      </a>
    </div>

  </div>
</footer>

<!-- =========================
     MODAL · ENCARGO RÁPIDO
========================= -->
<div class="modal" id="modal-encargo" aria-hidden="true">

  <div class="modal-backdrop"></div>

  <div class="modal-box">
    <button class="modal-close" aria-label="Cerrar">×</button>

    <div class="modal-image">
      <img id="modal-img-preview" src="" alt="">
    </div>

    <p class="modal-copy">
      <strong>Encarga tu Abaloria parecida a esta.</strong><br>
      Danos tus datos y la diseñaremos especialmente para ti.
    </p>

    <form method="POST" action="/api/encargo" data-redirect="/gracias.html" class="modal-form">

      <input type="hidden" name="imagen_referencia" id="modal-img-input">
      <input type="hidden" name="tipo" value="Referencia / pieza similar">

      <div class="form-group">
        <label class="form-label">Nombre y apellidos</label>
        <input type="text" name="nombre" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="tel" name="telefono">
      </div>

      <div class="form-group">
        <label class="form-label">Comentarios</label>
        <textarea
          name="comentarios"
          rows="3"
          placeholder="Petición especial, pieza específica, estilo, colección, colores…"
        ></textarea>
      </div>

      <button type="submit" class="cta-main">
        Encargar una Abaloria parecida
      </button>

    </form>
  </div>

</div>

<!-- =========================
     SCRIPTS
========================= -->

<!-- NAV MOBILE -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector('.nav-toggle');
  const nav = document.querySelector('.main-nav');
  if (!toggle || !nav) return;

  toggle.addEventListener('click', () => {
    nav.classList.toggle('is-open');
  });
});
</script>

<!-- MODAL -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const modal = document.getElementById("modal-encargo");
  const modalImg = document.getElementById("modal-img-preview");
  const modalInput = document.getElementById("modal-img-input");

  document.addEventListener("click", e => {
    const btn = e.target.closest(".js-open-modal");
    if (!btn) return;

    e.preventDefault();

    const imgUrl = btn.dataset.img;
    if (!imgUrl) return;

    const publicUrl = new URL(imgUrl, window.location.origin).href;

    modalImg.src = publicUrl;
    modalInput.value = publicUrl;

    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    modal.querySelector(".modal-box").scrollTop = 0;
  });

  modal.addEventListener("click", e => {
    if (
      e.target.classList.contains("modal-backdrop") ||
      e.target.classList.contains("modal-close")
    ) {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modal.classList.contains("is-open")) {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
    }
  });

});
</script>

<!-- GRID DINÁMICO -->
<script>
(async () => {

  const BASE_PATH = "/assets/colecciones/55/";
  const GRID = document.getElementById("collection-grid");

  const PIEZAS = [
    "55-01",
    "55-02",
    "55-03",
    "55-04",
    "55-05"
  ];

  for (const id of PIEZAS) {
    try {
      const res = await fetch(`${BASE_PATH}${id}/data.json`);
      if (!res.ok) continue;

      const data = await res.json();

      const mainImg = `${BASE_PATH}${id}/main.jpg`;
      const hoverImg = `${BASE_PATH}${id}/hover.jpg`;

      let hasHover = false;
      try {
        const h = await fetch(hoverImg, { method: "HEAD" });
        hasHover = h.ok;
      } catch {}

      const card = document.createElement("article");
      card.className = `piece-card ${data.estado}`;

      card.innerHTML = `
        <div class="piece-image">
          <img src="${mainImg}" alt="${data.titulo}" loading="lazy">
          ${hasHover ? `<img src="${hoverImg}" class="hover-img" alt="" loading="lazy">` : ""}
        </div>

        <div class="piece-body">
          <h2>${data.titulo}</h2>

          ${
            data.estado === "disponible"
              ? `
                <p class="piece-price">
                  55€ <span>IVA incluido · Envío 8€</span>
                </p>
                <a href="${data.sumup_link}" target="_blank" class="piece-cta">
                  Comprar ahora
                </a>
              `
              : `
                <p class="piece-sold-copy">
                  Esta pieza está vendida, pero puedes encargar una muy parecida.
                </p>
                <a href="#"
                   class="piece-cta alt js-open-modal"
                   data-img="${mainImg}">
                  Encargar parecida
                </a>
              `
          }
        </div>
      `;

      GRID.appendChild(card);

    } catch (err) {
      console.error("Error cargando pieza", id, err);
    }
  }

})();
</script>

</body>
</html>
