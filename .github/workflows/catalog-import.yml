name: Apply catalog update
on:
  push:
    branches:
      - catalogo-2026-09-16
    paths:
      - '.catalog-import/payload.zip'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply catalog update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: catalogo-2026-09-16
          fetch-depth: 0

      - name: Unpack catalog payload
        run: unzip -o .catalog-import/payload.zip -d .

      - name: Apply catalog changes
        run: python .catalog-import/apply.py

      - name: Remove temporary payload
        run: rm -rf .catalog-import

      - name: Commit catalog preview
        run: |
          git config user.name "AbaloriaBendita"
          git config user.email "hola@abaloriabendita.es"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply catalog update"
          git push origin catalogo-2026-09-16
