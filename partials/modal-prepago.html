<!-- MODAL PREPAGO -->
<style>
  #modal-prepago .modal-box{
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }

  #modal-prepago .modal-image img{
    max-height: 190px;
    object-fit: contain;
    margin: 0 auto;
  }

  #prepago-thumbnails{
    display:none;
    gap:8px;
    overflow-x:auto;
    margin:8px 0 14px;
    padding:2px 0 4px;
  }

  .shipping-zone-fieldset{
    border:0;
    padding:0;
    margin:0 0 16px;
  }

  .shipping-zone-legend{
    font-weight:800;
    margin-bottom:4px;
  }

  .shipping-zone-help{
    margin:0 0 10px;
    font-size:12px;
    opacity:.65;
  }

  .shipping-zone-list{
    display:grid;
    gap:7px;
  }

  .shipping-zone-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 12px;
    border:1px solid rgba(0,0,0,.12);
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }

  .shipping-zone-option:hover{
    border-color:rgba(15,61,46,.35);
  }

  .shipping-zone-option:has(input:checked){
    border-color:#0F3D2E;
    background:rgba(15,61,46,.05);
    box-shadow:0 0 0 1px rgba(15,61,46,.08);
  }

  .shipping-zone-main{
    display:flex;
    align-items:flex-start;
    gap:9px;
    min-width:0;
  }

  .shipping-zone-option input{
    width:16px;
    height:16px;
    margin:2px 0 0;
    flex:0 0 auto;
    accent-color:#0F3D2E;
  }

  .shipping-zone-name{
    font-size:14px;
    line-height:1.25;
  }

  .shipping-zone-price{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    flex:0 0 auto;
  }

  #shipping-zone-message{
    margin:-4px 0 14px;
    font-size:13px;
    line-height:1.4;
    color:#9b2c22;
  }

  @media (max-width:540px){
    #modal-prepago .modal-image img{
      max-height:160px;
    }

    .shipping-zone-option{
      padding:9px 10px;
    }

    .shipping-zone-name{
      font-size:13px;
    }
  }
</style>

<div class="modal" id="modal-prepago" aria-hidden="true">

  <div class="modal-backdrop"></div>

  <div class="modal-box">
    <button class="modal-close" aria-label="Cerrar">×</button>
    
    <div class="modal-image">
      <img id="prepago-img-preview" src="" alt="">
    </div>

    <div id="prepago-thumbnails" aria-label="Productos del pedido"></div>

    <p class="modal-copy">
      <strong>Confirmar pedido</strong><br>
      Desglose de tu compra.
    </p>

    <div class="modal-form">

      <fieldset class="shipping-zone-fieldset">
        <legend class="shipping-zone-legend">Destino del envío</legend>
        <p class="shipping-zone-help">Envío gratis a partir de 120 €.</p>

        <div class="shipping-zone-list">
          <label class="shipping-zone-option">
            <span class="shipping-zone-main">
              <input type="radio" name="shipping_zone" value="peninsula" checked>
              <span class="shipping-zone-name">Península</span>
            </span>
            <span class="shipping-zone-price">8,50 €</span>
          </label>

          <label class="shipping-zone-option">
            <span class="shipping-zone-main">
              <input type="radio" name="shipping_zone" value="baleares">
              <span class="shipping-zone-name">Baleares</span>
            </span>
            <span class="shipping-zone-price">11,50 €</span>
          </label>

          <label class="shipping-zone-option">
            <span class="shipping-zone-main">
              <input type="radio" name="shipping_zone" value="canarias">
              <span class="shipping-zone-name">Canarias</span>
            </span>
            <span class="shipping-zone-price">14,50 €</span>
          </label>

          <label class="shipping-zone-option">
            <span class="shipping-zone-main">
              <input type="radio" name="shipping_zone" value="quote">
              <span class="shipping-zone-name">Ceuta, Melilla o fuera de España</span>
            </span>
            <span class="shipping-zone-price">Consultar</span>
          </label>
        </div>
      </fieldset>

      <p id="shipping-zone-message" aria-live="polite"></p>

      <div class="prepago-summary">

        <div class="cart-row">
          <span>Producto</span>
          <span class="prepago-subtotal"></span>
        </div>

        <div class="cart-row">
          <span>IVA (21%) incluido</span>
          <span class="prepago-iva"></span>
        </div>

        <div class="cart-row">
          <span>Envío</span>
          <span class="prepago-shipping"></span>
        </div>

        <div class="cart-total-row">
          <strong>Total</strong>
          <strong class="prepago-total"></strong>
        </div>
      </div>

      <div class="rgpd-group">
        <div class="rgpd-row">
          <input type="checkbox" id="rgpd-check">
          <label>
            Aceptar nuestra 
            <a href="/privacidad.html" target="_blank">política de privacidad.</a>
          </label>
        </div>
      </div>

      <button id="go-to-payment" class="cta-main" type="button" disabled>
        Continuar compra
      </button>

    </div>
  </div>
</div>
