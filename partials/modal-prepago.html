<!-- MODAL PREPAGO -->
<div class="modal" id="modal-prepago" aria-hidden="true">

  <div class="modal-backdrop"></div>

  <div class="modal-box">
    <button class="modal-close" aria-label="Cerrar">×</button>
    
    <div class="modal-image">
      <img id="prepago-img-preview" src="" alt="">
    </div>

    <!-- Selector de imágenes para pedidos con varios productos -->
    <div
      id="prepago-thumbnails"
      aria-label="Productos del pedido"
      style="display:none;gap:8px;overflow-x:auto;margin:10px 0 4px;padding:2px 0 4px;"
    ></div>

    <p class="modal-copy">
      <strong>Confirmar pedido</strong><br>
      Desglose de tu compra.
    </p>

    <div class="modal-form">

      <fieldset style="border:0;padding:0;margin:0 0 18px;">
        <legend style="font-weight:800;margin-bottom:10px;">Destino del envío</legend>

        <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;cursor:pointer;">
          <span style="display:flex;align-items:center;gap:8px;">
            <input type="radio" name="shipping_zone" value="peninsula" checked>
            <span>Península</span>
          </span>
          <small>8,50 €</small>
        </label>

        <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;cursor:pointer;">
          <span style="display:flex;align-items:center;gap:8px;">
            <input type="radio" name="shipping_zone" value="baleares">
            <span>Baleares</span>
          </span>
          <small>11,50 €</small>
        </label>

        <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;cursor:pointer;">
          <span style="display:flex;align-items:center;gap:8px;">
            <input type="radio" name="shipping_zone" value="canarias">
            <span>Canarias</span>
          </span>
          <small>14,50 €</small>
        </label>

        <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;">
          <span style="display:flex;align-items:center;gap:8px;">
            <input type="radio" name="shipping_zone" value="quote">
            <span>Ceuta, Melilla o fuera de España</span>
          </span>
          <small>Consultar</small>
        </label>
      </fieldset>

      <p id="shipping-zone-message" aria-live="polite" style="margin:-4px 0 16px;font-size:13px;line-height:1.4;color:#9b2c22;"></p>

      <div class="prepago-summary">

        <div class="cart-row">
          <span>Producto</span>
          <span class="prepago-subtotal"></span>
        </div>

        <div class="cart-row">
          <span>IVA (21%) incluido</span>
          <span class="prepago-iva"></span>
        </div>

        <div class="cart-row">
          <span>Envío</span>
          <span class="prepago-shipping"></span>
        </div>

        <div class="cart-total-row">
          <strong>Total</strong>
          <strong class="prepago-total"></strong>
        </div>
      </div>

      <div class="rgpd-group">
        <div class="rgpd-row">
          <input type="checkbox" id="rgpd-check">
          <label>
            Aceptar nuestra 
            <a href="/privacidad.html" target="_blank">política de privacidad.</a>
          </label>
        </div>
      </div>

      <button id="go-to-payment" class="cta-main" type="button" disabled>
        Continuar compra
      </button>

    </div>
  </div>
</div>
