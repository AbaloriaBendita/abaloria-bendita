<!-- ================= MODAL ENCARGO ================= -->
<div class="modal" id="modal-encargo" aria-hidden="true">

  <div class="modal-backdrop"></div>

  <div class="modal-box">
    <button class="modal-close" aria-label="Cerrar">×</button>

    <div class="modal-image">
      <img id="modal-img-preview" src="" alt="">
    </div>

    <p class="modal-copy">
      <strong>Encarga tu Abaloria parecida a esta.</strong><br>
      Danos tus datos y la diseñaremos especialmente para ti.
    </p>

    <form method="POST" action="https://form-encargo.hola-38b.workers.dev/" data-redirect="/gracias.html" class="modal-form">

      <input type="hidden" name="imagen_referencia" id="modal-img-input">
      <input type="hidden" name="tipo" value="Referencia / pieza similar">

  <div class="form-group">
    <label class="form-label">Nombre</label>
    <input type="text" name="nombre" required>
  </div>

  <div class="form-group">
    <label class="form-label">Apellidos</label>
    <input type="text" name="apellidos" required>
  </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="tel" name="telefono">
      </div>
      
      <div class="form-group">
        <label class="form-label">Dirección completa para el envío</label>
<input 
  type="text" 
  name="direccion" 
  id="direccion-autocomplete"
  placeholder="Empieza a escribir tu dirección..."
  required
>
      </div>
      
      <div class="form-group">
        <label class="form-label">Comentarios</label>
        <textarea
          name="comentarios"
          rows="3"
          placeholder="Petición especial, estilo, colores…"
        ></textarea>
      </div>

      <button type="submit" class="cta-main">
        Encargar una Abaloria parecida
      </button>

     <div class="rgpd-group">
  <div class="rgpd-row">
    <input type="checkbox" name="rgpd" required>
    <label>
      He leído y acepto la
      <a href="/privacidad.html" target="_blank">política de privacidad</a>
    </label>
  </div>
</div>

    </form>
  </div>
</div>
