<aside id="cartPanel" class="cart-panel" aria-hidden="true">

  <div class="cart-backdrop"></div>

  <div class="cart-drawer">

    <div class="cart-header">
      <h2>Your cart</h2>

      <div class="cart-actions">
        <button class="cart-close" aria-label="Close">×</button>
      </div>
    </div>

    <div class="cart-items"></div>

    <div class="cart-footer">

      <div class="cart-row">
        <span>VAT (included)</span>
        <span class="cart-iva"></span>
      </div>

      <div class="cart-row">
        <span>Shipping</span>
        <span class="cart-shipping"></span>
      </div>

      <div class="cart-total-row">
        <strong>Total</strong>
        <strong class="cart-total"></strong>
      </div>

      <button class="cart-checkout cta-main">
        Checkout
      </button>

    </div>

  </div>

</aside>
