<div class="modal" id="modal-encargo" aria-hidden="true">

  <div class="modal-backdrop"></div>

  <div class="modal-box">
    <button class="modal-close" aria-label="Close">×</button>

    <div class="modal-image">
      <img id="modal-img-preview" src="" alt="">
    </div>

    <p class="modal-copy">
      <strong>Request a piece inspired by this one.</strong><br>
      Share your details and we’ll design it especially for you.
    </p>

    <form method="POST" action="/api/encargo" data-redirect="/en/thanks.html" class="modal-form">

      <input type="hidden" name="imagen_referencia" id="modal-img-input">
      <input type="hidden" name="tipo" value="Reference / similar piece">

      <div class="form-group">
        <label class="form-label">First name</label>
        <input type="text" name="nombre" required>
      </div>

      <div class="form-group">
        <label class="form-label">Last name</label>
        <input type="text" name="apellidos" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="tel" name="telefono">
      </div>
      
      <div class="form-group">
        <label class="form-label">Full shipping address</label>
        <input 
          type="text" 
          name="direccion" 
          id="direccion-autocomplete"
          placeholder="Start typing your address..."
          required
        >
      </div>
      
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea
          name="comentarios"
          rows="3"
          placeholder="Special request, style, colours…"
        ></textarea>
      </div>

      <button type="submit" class="cta-main">
        Request a similar Abaloria
      </button>

      <div class="rgpd-group">
        <div class="rgpd-row">
          <input type="checkbox" name="rgpd" required>
          <label>
            I have read and accept the
            <a href="/en/privacy.html" target="_blank">privacy policy</a>
          </label>
        </div>
      </div>

    </form>
  </div>
</div>
